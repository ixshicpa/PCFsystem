<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Petty Cash System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#1f6f5c;--ac2:#e3f1ed;--wa:#b4630a;--er:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222221;--tx:#efeee9;--mu:#a09f98;--bd:#383835;--ac:#4fb59c;--ac2:#1d3029;--wa:#e0a04d;--er:#f2837c}}
:root[data-theme="dark"]{--bg:#171716;--card:#222221;--tx:#efeee9;--mu:#a09f98;--bd:#383835;--ac:#4fb59c;--ac2:#1d3029;--wa:#e0a04d;--er:#f2837c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}
label{display:block;text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--er)}button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);white-space:nowrap}
.badge.w{background:#fbeedb;color:var(--wa)}.badge.e{background:#fbe4e2;color:var(--er)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}td input{min-width:70px;padding:5px}
.amt{font-variant-numeric:tabular-nums;font-weight:600}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(680px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}@media(max-width:700px){.fg{grid-template-columns:1fr 1fr}.fg>div{grid-column:auto!important}}@media(max-width:480px){.fg{grid-template-columns:1fr}}.pw{position:relative}.pw span{position:absolute;left:10px;top:8px;color:var(--mu)}.pw input{padding-left:26px}.note{background:var(--ac2);border:1px solid var(--ac);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}.err{color:var(--er);font-size:13px;margin-top:6px}
</style></head><body><main id="app"><p class="mu">Loading…</p></main>
<dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Demo mode: runs only outside Claude. Data is saved in this browser (localStorage). */
(function(){if(window.claude)return;
const P="pcs:",L=[];
const get=p=>{const v=localStorage.getItem(P+p);return v?JSON.parse(v):null};
const kids=c=>{const o=[],pre=P+c+"/";for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(pre)&&!k.slice(pre.length).includes("/"))o.push(k.slice(pre.length))}return o.sort()};
const sd=p=>{const d=get(p);return{id:p.split("/").pop(),exists:!!d,data:()=>d||undefined}};
const sc=c=>{const docs=kids(c).map(i=>sd(c+"/"+i));return{docs,size:docs.length,empty:!docs.length}};
const fire=()=>L.slice().forEach(l=>{try{l.f(l.col?sc(l.p):sd(l.p))}catch(e){}});
window.addEventListener("storage",fire);
const sub=(p,col,f)=>{const l={p,col,f};L.push(l);setTimeout(()=>f(col?sc(p):sd(p)),0);return()=>{const i=L.indexOf(l);if(i>=0)L.splice(i,1)}};
const put=(p,d)=>{localStorage.setItem(P+p,JSON.stringify(d));fire()};
const doc=p=>({get:async()=>sd(p),set:async d=>put(p,d),update:async d=>put(p,{...(get(p)||{}),...d}),delete:async()=>{localStorage.removeItem(P+p);fire()},onSnapshot:f=>sub(p,false,f)});
const col=c=>({doc:i=>doc(c+"/"+i),onSnapshot:f=>sub(c,true,f)});
const mods={user:{id:async()=>"u_local",canEdit:()=>true,isOwner:()=>true,profiles:async()=>({})},db:{doc,collection:col},
 downloads:{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=filename;a.click()}}};
window.claude={use:async n=>mods[n]||null};
document.addEventListener("DOMContentLoaded",()=>{const b=document.createElement("div");b.className="note";b.style.cssText="position:fixed;bottom:8px;left:8px;right:8px;max-width:520px;margin:auto;z-index:5";b.innerHTML="Demo mode: data is saved only in this browser. <button onclick='this.parentNode.remove()'>OK</button>";document.body.appendChild(b)});
})();
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const peso=n=>"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const ST={pending:["Waiting for supervisor",""],approved:["Approved, waiting for release","w"],released:["Released, needs liquidation","w"],liquidated:["Liquidated, needs checking","w"],closed:["Closed",""],rejected:["Rejected","e"]};
ST.returned=["Returned for clarification","w"];
let db,uid,prof,reqs=[],tab="",mode="",unsub,unsubS,VS={company:"",prefix:"PCV-",days:5},ARM="",accF="wait",vsOpen=false;
const ROLES={requester:"Requester (Staff)",supervisor:"Supervisor",accounting:"Accounting"};

let AA={},FD=[],PA={},unsubAA,unsubFD,unsubPA,unsubP,unsubSE,ETS=null,ETD=null,audM=today().slice(0,7),audAll=false,UU,isAdmin=false,SU=[],RO={},unsubR,unsubSU,unsubRO;
const softRender=()=>{const ae=document.activeElement;if(!(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))render()};
async function init(){
  try{UU=await claude.use("user");db=await claude.use("db");if(!db||!UU){$("#app").innerHTML='<div class="card">Cannot open the database. Please sign in and open this link as a <b>Contributor</b> or higher.</div>';return}
  uid=await UU.id();isAdmin=!!(await UU.canEdit())||!!(await UU.isOwner());}catch(e){$("#app").innerHTML='<div class="card">Could not load the system.</div>';return}
  let su=null;try{const x=await db.doc("signups/"+uid).get();su=x.exists?x.data():null}catch(e){}
  if(!su||!su.name)return signup();
  gate(su.name);
}
function signup(){
  $("#app").innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h1>Petty Cash System</h1><p class="mu">Sign up to use the system. After you sign up, the admin will set your role and department.</p>
  <label>Username</label><input id="nm" placeholder="Example: JUAN0101"><div class="row" style="margin-top:12px"><button class="p" id="go">Sign up</button></div><div class="err" id="e"></div></div>`;
  $("#go").onclick=async()=>{const name=$("#nm").value.trim();if(!name){$("#e").textContent="Please enter a username.";return}
    try{await db.doc("signups/"+uid).set({name,joinedAt:Date.now()})}catch(e){$("#e").textContent="Could not sign up: "+e.code;return}gate(name)};
}
function stopData(){if(unsub){unsub();unsub=null}if(unsubS){unsubS();unsubS=null}if(unsubSU){unsubSU();unsubSU=null}if(unsubRO){unsubRO();unsubRO=null}if(unsubSE){unsubSE();unsubSE=null}if(unsubAA){unsubAA();unsubAA=null}if(unsubFD){unsubFD();unsubFD=null}if(unsubPA){unsubPA();unsubPA=null}}
function pending(name){stopData();$("#app").innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h1>Waiting for access</h1><p>Hi <b>${esc(name)}</b>! Your account is <b>pending</b>. The admin has to set your role and department first. This page updates by itself once that is done.</p></div>`}
function gate(name){
  if(isAdmin){prof={role:"accounting",dept:"Accounting Department",name};tab="";start();return}
  if(unsubR)unsubR();if(unsubP)unsubP();
  let rd=null,pd=null;
  const apply=()=>{const d=rd&&rd.role?rd:pd;if(!d||!d.role||d.role==="pending"){prof=null;pending(name);return}
    const np={role:d.role,dept:d.dept||"",name},ch=!prof||prof.role!==np.role||prof.dept!==np.dept;prof=np;if(ch){tab="";start()}};
  unsubR=db.doc("roles/"+uid).onSnapshot(x=>{rd=x.exists?x.data():null;apply()},()=>pending(name));
  unsubP=db.doc("preapproved/"+dkey(name)).onSnapshot(x=>{pd=x.exists?x.data():null;apply()},()=>{});
}
function start(){
  mode=prof.role==="accounting"?"todo":"list";tab=tab||(prof.role==="accounting"?"todo":prof.role==="supervisor"?"todo":"new");
  stopData();
  unsubSE=db.doc("settings/expenseTypes").onSnapshot(x=>{const d=x.exists?x.data():null;ETS=d&&Array.isArray(d.list)?d.list:null;softRender()},()=>{});
  unsubAA=db.collection("autoapprove").onSnapshot(x=>{AA={};x.docs.forEach(d=>AA[d.id]=d.data()||{});softRender()},()=>{});
  if(prof.role==="accounting")unsubFD=db.collection("fund").onSnapshot(x=>{FD=x.docs.map(d=>d.data());softRender()},()=>{});
  if(isAdmin){unsubPA=db.collection("preapproved").onSnapshot(x=>{PA={};x.docs.forEach(d=>PA[d.id]=d.data());softRender()},()=>{});unsubSU=db.collection("signups").onSnapshot(x=>{SU=x.docs.map(d=>({id:d.id,...d.data()}));softRender()},()=>{});unsubRO=db.collection("roles").onSnapshot(x=>{RO={};x.docs.forEach(d=>RO[d.id]=d.data());softRender()},()=>{})}
  unsubS=db.doc("settings/voucher").onSnapshot(x=>{if(x.exists)VS={...VS,...x.data()};const ae=document.activeElement;if(!(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))render()},()=>{});
  unsub=db.collection("requests").onSnapshot(s=>{reqs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);const ae=document.activeElement;if(tab==="new"&&ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&$("#myreq")){$("#myreq").innerHTML=myReqHtml();document.querySelectorAll("#myreq [data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i))}else render()},e=>{$("#app").innerHTML='<div class="card">Cannot read requests ('+esc(e.code)+').</div>'});
}
const mine=()=>reqs.filter(r=>prof.role==="accounting"||(prof.role==="supervisor"?r.dept===prof.dept:r.createdBy===uid));
const open=n=>reqs.some(r=>(r.status==="released"||r.status==="liquidated")&&r.employee.trim().toLowerCase()===n.trim().toLowerCase());

function render(){
  if($("#sub")&&!skipCap){FS={};["dn","n","dp","a","et","p","rm","eo","ur","urr"].forEach(k=>{const e=$("#"+k);if(e)FS[k]=e.type==="checkbox"?e.checked:e.value})}skipCap=false;
  const R=prof.role,L=mine();
  const todo=R==="supervisor"?L.filter(r=>r.status==="pending"||r.status==="returned"):R==="accounting"?L.filter(r=>r.status==="approved"||r.status==="liquidated"):L.filter(r=>r.status==="released"||r.status==="returned");
  const tabs=[["todo",R==="supervisor"?"To Approve":R==="accounting"?"Accounting":"To Liquidate",todo.length],];if(R!=="accounting")tabs.push(["list","All Requests",L.length]);
  if(R!=="accounting"||isAdmin)tabs.unshift(["new","Request Budget"]);
  if(R==="accounting")tabs.push(["log","Open Cash"]);
  if(R!=="requester")tabs.push(["rep","Reports"],["audit","Audit Log"]);
  if(R==="accounting")tabs.push(["settings","Settings"]);
  if(isAdmin)tabs.push(["users","Users"]);
  if(R==="supervisor"||isAdmin)tabs.push(["auto","Approval Limits"]);
  if(R==="accounting")tabs.push(["fund","Petty Cash Fund"]);
  tabs.push(["guide","Guide"]);
  let body="";
  if(tab==="new")body=newForm();
  else if(tab==="log")body=logView();
  else if(tab==="rep")body=repView();
  else if(tab==="guide")body=guideView();
  else if(tab==="auto"&&(R==="supervisor"||isAdmin))body=autoView();
  else if(tab==="fund"&&R==="accounting")body=fundView();
  else if(tab==="audit"&&R!=="requester")body=auditView();
  else if(tab==="settings"&&R==="accounting")body=settingsView();
  else if(tab==="users"&&isAdmin)body=usersView();
  else if(tab==="todo"&&R==="accounting")body=accView();
  else{const rows=tab==="todo"?todo:L;body=rows.length?rows.map(card).join(""):'<div class="card mu">Nothing here.</div>'}
  $("#app").innerHTML=`<header><div><h1>Petty Cash System</h1><div class="mu">${esc(prof.name)} · ${isAdmin?"Admin":ROLES[R]}${prof.dept&&!isAdmin?" · "+esc(prof.dept):""}</div></div></header>${realUid?`<div class="note">Viewing as <b>${esc(prof.name)}</b> (${ROLES[R]}). Anything you do is saved under this person's name. <button id="vb">Back to Admin</button></div>`:""}
  <div class="tabs">${tabs.map(([k,n,c])=>`<button data-t="${k}" class="${tab===k?"on":""}">${n}${c!=null?" ("+c+")":""}</button>`).join("")}</div>${body}`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;ETD=null;flash="";render()});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i));
  if($("#vb"))$("#vb").onclick=backToAdmin;
  document.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>review(b.dataset.dt));
  if(tab==="new")bindNew();
  if(tab==="rep")bindRep();
  if(tab==="auto")bindAuto();
  if(tab==="fund")bindFund();
  if(tab==="audit")bindAudit();
  if(tab==="settings"&&R==="accounting")bindSettings();
  if(tab==="users"&&isAdmin)bindUsers();
  if(tab==="todo"&&R==="accounting")bindAcc();
}
const DEPTS=["Accounting Department","Operations Department","Sales Department","Admin Department","HR Department","IT Department","Others"];
const deptList=()=>[...new Set([...DEPTS,prof&&prof.dept,...reqs.map(r=>r.dept)].filter(Boolean))];
let FS={},skipCap=false;
function myReqHtml(){const m=reqs.filter(r=>r.createdBy===uid);return m.length?m.map(card).join(""):'<div class="card mu" style="text-align:center;padding:24px">You have no requests yet. Fill in the form above to send your first one.</div>'}
function newForm(){
  const sup=prof.role==="supervisor"||isAdmin,v=k=>esc(FS[k]??""),ds=FS.dp??prof.dept;
  return `${flash?`<div class="note">${esc(flash)}</div>`:""}<div class="card"><h2>NEW REQUEST</h2><p class="mu">Fill in the form and press Submit. ${sup?"":"Your supervisor will review it first, then it goes to Accounting."}</p><div class="note"><b>Note:</b> Cash is released at least 1 working day after your request is approved. If you need the cash today, tick <b>Urgent</b> below and explain why.</div>
  <div class="fg"><div><label>Request Date</label><input id="dn" type="date" value="${FS.dn||today()}"></div>
  <div><label>Employee Name</label><input id="n" value="${esc(FS.n??prof.name)}"></div>
  <div><label>Department</label><select id="dp">${deptList().map(d=>`<option ${d===ds?"selected":""}>${esc(d)}</option>`).join("")}</select></div>
  <div><label>Amount Requested</label><div class="pw"><span>₱</span><input id="a" type="number" min="1" step="0.01" placeholder="0.00" value="${v("a")}"></div></div>
  <div><label>Expense Type</label><select id="et"><option value="" disabled ${FS.et?"":"selected"}>Choose expense type</option>${[...ETL(),"Others"].map(t=>`<option ${t===FS.et?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
  <div id="eow" style="${FS.et==="Others"?"":"display:none"}"><label>Specify expense</label><input id="eo" placeholder="What is this expense?" value="${v("eo")}"></div>
  <div style="grid-column:span 2"><label>Purpose / Description</label><input id="p" placeholder="Example: Router for the office" value="${v("p")}"></div></div>
  <label style="display:flex;gap:6px;align-items:center;text-transform:none;font-size:14px"><input type="checkbox" id="ur" style="width:auto" ${FS.ur?"checked":""}> Urgent (cash needed today)</label><div id="urw" style="${FS.ur?"":"display:none"}"><label>Why is it urgent?</label><input id="urr" value="${v("urr")}"></div>
  <label>Remarks (optional)</label><textarea id="rm" rows="3">${v("rm")}</textarea>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="p" id="sub">Submit Request</button></div><div class="err" id="e" style="text-align:center"></div></div>
  <h2 style="margin-top:18px">MY REQUESTS</h2><div id="myreq">${myReqHtml()}</div>`;
}
function bindNew(){
  $("#ur").onchange=()=>{$("#urw").style.display=$("#ur").checked?"":"none"};
  $("#et").onchange=()=>{$("#eow").style.display=$("#et").value==="Others"?"":"none"};
  $("#sub").onclick=async()=>{
    const n=$("#n").value.trim(),a=parseFloat($("#a").value),p=$("#p").value.trim(),et=$("#et").value,rm=$("#rm").value.trim(),e=$("#e");
    if(!n||!p||!(a>0)||!et){e.textContent="Please fill in the employee name, amount, expense type and purpose.";return}
    const ur=$("#ur").checked,urr=$("#urr").value.trim();if(ur&&!urr){e.textContent="Please explain why it is urgent.";return}
    const eo=$("#eo").value.trim();if(et==="Others"&&!eo){e.textContent="Please specify what the expense is.";return}
    if(open(n)){e.textContent=n+" still has cash that is not liquidated. Liquidate it before requesting again.";return}
    const sup=prof.role==="supervisor"||isAdmin,now=Date.now(),ds=today().replace(/-/g,""),cfg=AA[dkey($("#dp").value)]||{},lim=Math.min((cfg.rules||{})[et]||0,cfg.maxEach||Infinity),used=reqs.filter(x=>x.auto&&x.dept===$("#dp").value&&x.status!=="rejected"&&mkey(x.createdAt)===mkey(now)).reduce((t,x)=>t+(x.approvedAmount||x.amount),0),auto=!sup&&lim>0&&a<=lim&&(!cfg.maxMonth||used+a<=cfg.maxMonth),ok=sup||auto;
    const no="CR-"+ds+"-"+String(reqs.filter(r=>r.no&&r.no.includes(ds)).length+1).padStart(3,"0");
    const r={no,employee:n,dept:$("#dp").value,purpose:p,type:et,typeOther:et==="Others"?eo:"",urgent:ur,urgentReason:urr,amount:a,dateNeeded:$("#dn").value,remarks:rm,status:ok?"approved":"pending",auto,createdBy:uid,createdAt:now,approvedBy:ok?(auto?"auto":uid):null,approvedAt:ok?now:null,approvedAmount:ok?a:null,supNotes:sup?rm:"",log:[[now,sup?"Created and approved by Supervisor":auto?"Submitted and auto-approved (supervisor rule)":"Submitted request",prof.name,a,rm||p]]};
    try{await db.collection("requests").doc("r"+now).set(r)}catch(x){e.textContent="Could not save: "+x.code;return}
    flash=sup?"Your request was approved and sent to Accounting.":auto?"Your request was approved automatically because it is within the limit set by your supervisor. It now goes to Accounting for release.":"Your request was sent to your supervisor for approval.";FS={};skipCap=true;render();
  };
}
function card(r){
  const R=prof.role,[sl,sc]=ST[r.status];let btn="";
  if(R==="supervisor"&&r.status==="pending")btn=`<button class="p" data-a="approve" data-i="${r.id}">Approve</button><button class="d" data-a="reject" data-i="${r.id}">Reject</button>`;
  if(R==="accounting"&&r.status==="approved")btn=`<button class="p" data-a="release" data-i="${r.id}">Release Cash</button><button class="d" data-a="reject" data-i="${r.id}">Reject</button>`;
  if(R==="accounting"&&r.status==="liquidated")btn=`<button class="p" data-a="verify" data-i="${r.id}">Check &amp; Settle</button>`;
  if(r.status==="released"&&(r.createdBy===uid||R==="supervisor"||R==="accounting"))btn=`<button class="p" data-a="liquidate" data-i="${r.id}">Liquidate</button>`;
  if(r.status==="returned"&&(r.createdBy===uid||R==="supervisor"))btn=`<button class="p" data-a="resubmit" data-i="${r.id}">Reply &amp; Resubmit</button>`;
  if(r.voucherNo)btn+=`<button data-a="print" data-i="${r.id}">🖨 Voucher &amp; Liquidation Form</button>`;
  const late=r.status==="released"&&r.dueDate&&r.dueDate<today();
  return `<div class="card"><div class="row sp"><b>${esc(r.no)} · ${esc(r.employee)}${urg(r)}</b><span class="badge ${late?"e":sc}">${late?"Overdue":sl}</span></div>
  <div class="mu">${esc(r.dept)} · ${typeLabel(r)?esc(typeLabel(r))+" · ":""}Date: ${esc(r.dateNeeded)}</div>${age(r)?`<div class="mu">⏱ ${esc(age(r))}</div>`:""}${r.auto?`<div class="mu" style="color:var(--ac)">✓ Approved automatically because it is within the supervisor's limit.</div>`:""}<p style="margin:8px 0">${esc(r.purpose)}</p>${r.remarks&&r.remarks!==r.supNotes?`<div class="mu">Remarks: ${esc(r.remarks)}</div>`:""}${r.supNotes?`<div class="mu">Supervisor remarks: ${esc(r.supNotes)}</div>`:""}
  <div class="row sp"><span>Requested: <span class="amt">${peso(r.amount)}</span></span>${r.voucherNo?`<span>Voucher: <b>${esc(r.voucherNo)}</b> · Received: <span class="amt">${peso(r.cashReceived)}</span> · Due: ${esc(r.dueDate)}</span>`:""}</div>
  ${r.rejectReason?`<div class="err">Reason for rejection: ${esc(r.rejectReason)}</div>`:""}

function liqTable(r){

  <div class="amt" style="margin-top:6px">${diff>0?"Excess cash to return: "+peso(diff):diff<0?"Additional cash needed: "+peso(-diff):"No excess or shortage"}</div>`;

async function save(id,patch,msg){
  const r=reqs.find(x=>x.id===id);
  try{await db.collection("requests").doc(id).update({...patch,log:[...r.log,[Date.now(),msg,prof.name,patch.cashReceived??patch.approvedAmount??r.cashReceived??r.amount,patch.rejectReason||patch.supNotes||""]]})}catch(e){alert("Could not save: "+e.code)}
}
function dlg(html){const d=$("#dlg");d.innerHTML=html;d.showModal();return d}
function act(a,id){
  const r=reqs.find(x=>x.id===id),now=Date.now();

  if(a==="reject"){const d=dlg(`<h2>Reject ${esc(r.no)}</h2><label>Reason</label><textarea id="rs" rows="3"></textarea><div class="row" style="margin-top:12px"><button class="p" id="ok">Reject</button><button id="x">Cancel</button></div>`);
    $("#x").onclick=()=>d.close();$("#ok").onclick=()=>{const v=$("#rs").value.trim();if(!v)return;d.close();save(id,{status:"rejected",rejectReason:v},"Rejected ("+(prof.role==="accounting"?"Accounting":"Supervisor")+")")};return}
  if(a==="release"){const n=reqs.filter(x=>x.voucherNo).length+1,d=dlg(`<h2>Release: ${esc(r.no)}</h2><p class="mu">${esc(r.employee)} – ${esc(r.purpose)}</p><p class="mu">Fund balance: <b>${peso(fundCalc().bal)}</b>${fundCalc().bal<(r.approvedAmount||r.amount)?' <span style="color:var(--er)">– not enough for this request</span>':""}</p><div class="g2"><div><label>Voucher No.</label><input id="vn" value="${esc(VS.prefix)}${String(n).padStart(5,"0")}"></div><div><label>Amount to release (₱)</label><input id="am" type="number" step="0.01" value="${r.approvedAmount||r.amount}"></div><div><label>Liquidation Due Date</label><input id="dd" type="date" value="${addDays(today(),+VS.days||5)}"></div></div><div class="row" style="margin-top:12px"><button class="p" id="ok">Confirm Release</button><button id="x">Cancel</button></div><div class="err" id="e"></div>`);
    $("#x").onclick=()=>d.close();$("#ok").onclick=()=>{const am=parseFloat($("#am").value),vn=$("#vn").value.trim();if(!(am>0)||!vn){$("#e").textContent="Enter the voucher number and amount.";return}d.close();save(id,{status:"released",accRemarks:ARM,voucherNo:vn,cashReceived:am,dueDate:$("#dd").value,releasedAt:now,releasedBy:uid},"Cash released ("+peso(am)+") – "+vn)};return}
  if(a==="liquidate"){let items=[{}];
    const d=dlg("");const draw=()=>{const tot=items.reduce((s,i)=>s+(parseFloat(i.amt)||0),0),df=r.cashReceived-tot;
      d.innerHTML=`<h2>Liquidation Form – ${esc(r.voucherNo)}</h2><p class="mu">${esc(r.employee)} · Cash Received: <b>${peso(r.cashReceived)}</b> · Due: ${esc(r.dueDate)}</p>
      <div class="tw"><table><tr><th>#</th><th>Date</th><th>OR No.</th><th>Supplier</th><th>Description</th><th>Amount</th><th></th></tr>${items.map((i,k)=>`<tr><td>${k+1}</td><td><input type="date" data-k="${k}" data-f="date" value="${esc(i.date||"")}"></td><td><input data-k="${k}" data-f="or" value="${esc(i.or||"")}"></td><td><input data-k="${k}" data-f="sup" value="${esc(i.sup||"")}"></td><td><input data-k="${k}" data-f="desc" value="${esc(i.desc||"")}"></td><td><input type="number" step="0.01" data-k="${k}" data-f="amt" value="${esc(i.amt||"")}"></td><td><button data-rm="${k}">✕</button></td></tr>`).join("")}</table></div>
      <div class="row sp" style="margin-top:8px"><button id="ad">+ Add row</button><span class="amt">Total: ${peso(tot)} · ${df>0?"Excess: "+peso(df):df<0?"Short: "+peso(-df):"Matches"}</span></div>
      <p class="mu">Attach the receipts in order, using the row numbers.</p><div class="row"><button class="p" id="ok">Submit</button><button id="x">Cancel</button></div><div class="err" id="e"></div>`;
      d.querySelectorAll("input[data-k]").forEach(i=>i.onchange=()=>{items[i.dataset.k][i.dataset.f]=i.value;draw()});
      d.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{items.splice(b.dataset.rm,1);if(!items.length)items=[{}];draw()});
      $("#ad").onclick=()=>{items.push({});draw()};$("#x").onclick=()=>d.close();
      $("#ok").onclick=()=>{const ok=items.every(i=>i.date&&i.or&&i.sup&&i.desc&&parseFloat(i.amt)>0);if(!ok){$("#e").textContent="Fill in every column in each row.";return}
        d.close();save(id,{status:"liquidated",items:items.map(i=>({date:i.date,or:i.or,sup:i.sup,desc:i.desc,amt:parseFloat(i.amt)})),liqAt:Date.now(),actualExpense:items.reduce((s,i)=>s+parseFloat(i.amt),0)},prof.role==="accounting"?"Liquidation recorded by Accounting":"Liquidation submitted")}};draw();return}
  if(a==="verify"){const tot=r.actualExpense??r.items.reduce((s,i)=>s+i.amt,0),df=r.cashReceived-tot,k=df>0?"returned":df<0?"additional":"none";
    const d=dlg(`<h2>Check &amp; settle: ${esc(r.voucherNo)}</h2>${liqTable(r)}<p class="amt">Released: ${peso(r.cashReceived)} · Actual expense: ${peso(tot)}</p>
    ${k==="none"?"<p>No excess or shortage.</p>":`<p><b>${k==="returned"?"Excess cash to be returned: "+peso(df):"Additional cash needed: "+peso(-df)}</b></p><label>${k==="returned"?"Amount received back from the employee":"Amount given to the employee"} (₱)</label><input id="sa" type="number" step="0.01" value="${Math.abs(df).toFixed(2)}"><label style="display:flex;gap:6px;align-items:center;text-transform:none"><input type="checkbox" id="sc" style="width:auto"> ${k==="returned"?"I confirm the cash was received":"I confirm the cash was given"}</label>`}
    <div class="row" style="margin-top:12px"><button class="p" id="ok">Record &amp; close</button><button id="x">Cancel</button></div><div class="err" id="e"></div>`);
    $("#x").onclick=()=>d.close();$("#ok").onclick=()=>{let sa=0;if(k!=="none"){sa=parseFloat($("#sa").value);if(!$("#sc").checked||!(sa>0)){$("#e").textContent="Enter the amount and confirm the cash.";return}}
      d.close();save(id,{status:"closed",closedAt:now,actualExpense:tot,settleType:k,settleAmount:sa,settledAt:now},"Closed. "+(k==="returned"?"Excess returned "+peso(sa):k==="additional"?"Additional cash given "+peso(sa):"No excess or shortage"))}}
}

@media print{@page{size:A4;margin:10mm}body>*:not(#pv){display:none!important}#pv{position:static;background:none;padding:0;overflow:visible}#pv .tb{display:none}}`;
{const st=document.createElement("style");st.textContent=PCSS;document.head.appendChild(st)}
const WORDS=n=>{const o=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const f=n=>n<20?o[n]:n<100?t[(n/10)|0]+(n%10?"-"+o[n%10]:""):o[(n/100)|0]+" Hundred"+(n%100?" "+f(n%100):"");
  let p=Math.floor(n),c=Math.round((n-p)*100),s="";for(const [v,nm] of [[1e9,"Billion"],[1e6,"Million"],[1e3,"Thousand"]])if(p>=v){s+=f(Math.floor(p/v))+" "+nm+" ";p%=v}
  if(p||!s)s+=f(p);return s.trim()+" Pesos"+(c?" and "+c+"/100":" Only")};

const dkey=d=>(d||"").toLowerCase().replace(/[^a-z0-9]+/g,"_");
const dayText=t=>{const n=Math.floor((Date.now()-t)/864e5);return n<1?"less than 1 day":n===1?"1 day":n+" days"};
const age=r=>{const m={pending:[r.createdAt,"Waiting for approval for"],approved:[r.approvedAt,"Approved, not released for"],released:[r.releasedAt,"Not liquidated for"],liquidated:[r.liqAt,"Liquidated, not closed for"]}[r.status];return m&&m[0]?m[1]+" "+dayText(m[0]):""};
const approvalNote=r=>{if(!r.approvedAt)return"";if(r.auto)return'<div class="note">✓ <b>Approved automatically</b> because it is within the supervisor\'s limit.</div>';const l=r.log.find(x=>/^(Created and approved|Approved by)/.test(x[1]));return`<div class="note">Approved by <b>${esc((l&&l[2])||"Supervisor")}</b> on ${pht(r.approvedAt)}.</div>`};
const urg=r=>r.urgent&&["pending","approved","returned"].includes(r.status)?' <span class="badge e">URGENT</span>':"";
const ETL=()=>(ETS||ET).filter(t=>t.toLowerCase()!=="others");
const typeLabel=r=>r.finalType||(r.type==="Others"&&r.typeOther?"Others – "+r.typeOther:r.type||"");
const typeKey=r=>r.finalType||(r.type==="Others"?"Others (to be classified)":r.type||"Unspecified");
const ET=["Gas & Oil","Repair & Maintenance","Office Supplies","Meals & Representation","Transportation","Others"];
let repMonth=today().slice(0,7),repAll=false;
const mkey=t=>new Date(t+8*36e5).toISOString().slice(0,7);
const pht=t=>new Date(t).toLocaleString("en-PH",{timeZone:"Asia/Manila",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
const isAppr=r=>["approved","released","liquidated","closed"].includes(r.status);
function repData(){
  const L=mine(),inM=t=>repAll||mkey(t)===repMonth,rs=L.filter(r=>inM(r.createdAt));
  const ap=rs.filter(isAppr),T={};
  ap.forEach(r=>{const k=typeKey(r);T[k]=T[k]||{n:0,a:0,rl:0,nf:0};T[k].n++;T[k].a+=r.approvedAmount||r.amount;T[k].rl+=r.cashReceived||0;if(!r.finalType)T[k].nf++});
  return{rs,ap,T,req:rs.reduce((s,r)=>s+r.amount,0),apt:ap.reduce((s,r)=>s+(r.approvedAmount||r.amount),0),rl:rs.reduce((s,r)=>s+(r.cashReceived||0),0)};
}
function auditData(){
  const inM=t=>audAll||mkey(t)===audM,au=[];
  mine().forEach(r=>r.log.forEach(l=>{if(inM(l[0]))au.push({t:l[0],no:r.no,emp:r.employee,act:l[1],by:l[2]||"",amt:l[3],rm:l[4]||""})}));
  return au.sort((a,b)=>b.t-a.t);
}
function monthBar(id,m,all,xid,title,sub){

  <label style="display:flex;gap:6px;align-items:center;margin:0 0 8px"><input type="checkbox" id="${id}a" style="width:auto" ${all?"checked":""}> Show all months</label><button class="p" id="${xid}">Download Excel</button></div></div>`;
}
function repView(){
  const d=repData(),T=Object.entries(d.T).sort((a,b)=>b[1].a-a[1].a);
  return monthBar("rp",repMonth,repAll,"xl","Monthly Report","Choose a month, then download all the records in Excel.")+`
  <div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">

  <p class="mu">Auto-approved this month: <b>${peso(used)}</b>${cfg.maxMonth?" of "+peso(cfg.maxMonth)+" (left: "+peso(Math.max(0,cfg.maxMonth-used))+")":""}</p>
  <h2 style="margin-top:12px">2. Auto-approved expense types and their limits</h2><div class="tw"><table><tr><th>On</th><th>Expense type</th><th>Limit per request (₱)</th></tr>${ETL().map((t,i)=>`<tr><td><input type="checkbox" data-ao="${i}" style="width:auto" ${cur[t]>0?"checked":""}></td><td>${esc(t)}</td><td><input type="number" min="1" data-al="${i}" value="${cur[t]||""}"></td></tr>`).join("")}</table></div>
  <div class="row" style="margin-top:10px"><button class="p" id="asv">Save rules</button></div><div class="err" id="ae"></div></div>`;
}
function bindAuto(){
  if($("#ald"))$("#ald").onchange=e=>{alDept=e.target.value;render()};
  $("#asv").onclick=async()=>{const rules={};let bad=false;ETL().forEach((t,i)=>{if(document.querySelector(`[data-ao="${i}"]`).checked){const v=parseFloat(document.querySelector(`[data-al="${i}"]`).value);if(v>0)rules[t]=v;else bad=true}});
    if(bad){$("#ae").textContent="Enter a limit for each type that is turned on.";return}
    try{await db.doc("autoapprove/"+dkey(deptFor())).set({rules,maxEach:parseFloat($("#ame").value)||0,maxMonth:parseFloat($("#amm").value)||0});$("#asv").textContent="Saved ✓"}catch(e){$("#ae").textContent="Could not save: "+e.code}};
}
function fundCalc(){
  let bal=0,add=0,rel=0,ret=0,ex=0,out=0;const ev=[];
  FD.forEach(f=>{const v=f.type==="decrease"?-f.amount:f.amount;add+=v;ev.push({t:f.t,l:({opening:"Opening balance",replenish:"Money added",decrease:"Money removed"}[f.type]||"Entry")+(f.note?" – "+f.note:""),v})});
  reqs.forEach(r=>{if(r.releasedAt){ev.push({t:r.releasedAt,l:"Cash released – "+r.voucherNo+" ("+r.employee+")",v:-r.cashReceived});rel+=r.cashReceived}
    if(r.settleType==="returned"){ev.push({t:r.settledAt,l:"Excess returned – "+r.voucherNo,v:r.settleAmount});ret+=r.settleAmount}
    if(r.settleType==="additional"){ev.push({t:r.settledAt,l:"Additional cash given – "+r.voucherNo,v:-r.settleAmount});ex+=r.settleAmount}
    if(r.status==="released"||r.status==="liquidated")out+=r.cashReceived});
  ev.sort((a,b)=>a.t-b.t);ev.forEach(e=>{bal+=e.v;e.b=bal});
  return{bal,add,net:rel-ret+ex,out,ev:ev.reverse()};
}
function fundView(){
  const f=fundCalc();
  return `<div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px">${[[peso(f.bal),"Current fund balance"],[peso(f.add),"Money added to the fund"],[peso(f.net),"Net cash paid out"],[peso(f.out),"Cash with employees (not settled)"]].map(([v,l])=>`<div class="card" style="margin:0"><div class="amt" style="font-size:18px">${v}</div><div class="mu">${l}</div></div>`).join("")}</div>
  <div class="card"><h2>Add or remove money</h2><div class="fg"><div><label>Type</label><select id="ft2"><option value="opening">Opening balance</option><option value="replenish">Add money (replenishment)</option><option value="decrease">Remove money (correction)</option></select></div><div><label>Amount (₱)</label><input id="fa" type="number" step="0.01" min="0"></div><div style="grid-column:span 2"><label>Note</label><input id="fn"></div></div><div class="row" style="margin-top:10px"><button class="p" id="fadd">Save</button></div><div class="err" id="fe"></div></div>
  <h2>Fund history</h2><div class="card tw"><table><tr><th>Date</th><th>Description</th><th>In</th><th>Out</th><th>Balance</th></tr>${f.ev.map(e=>`<tr><td>${pht(e.t)}</td><td>${esc(e.l)}</td><td class="amt">${e.v>0?peso(e.v):""}</td><td class="amt">${e.v<0?peso(-e.v):""}</td><td class="amt">${peso(e.b)}</td></tr>`).join("")||'<tr><td colspan="5" class="mu">No entries yet. Add the opening balance first.</td></tr>'}</table></div>`;
}
function bindFund(){
  $("#fadd").onclick=async()=>{const a=parseFloat($("#fa").value);if(!(a>0)){$("#fe").textContent="Enter an amount.";return}
    try{await db.collection("fund").doc("f"+Date.now()).set({t:Date.now(),type:$("#ft2").value,amount:a,note:$("#fn").value.trim(),by:prof.name})}catch(e){$("#fe").textContent="Could not save: "+e.code}};
}
function guideView(){
  const R=prof.role,box=(t,l)=>`<div class="card"><h2>${t}</h2><ol style="margin:0;padding-left:20px">${l.map(x=>`<li style="margin-bottom:4px">${x}</li>`).join("")}</ol></div>`;
  const rq=box("For people who request cash",["Open <b>Request Budget</b> and fill in your name, department, amount, expense type, and purpose.","Choose <b>Others</b> if your expense type is not in the list, then write what it is.","Send the request. Your supervisor approves it, then Accounting releases the cash. Some expense types are approved automatically up to a limit.","Cash is released at least 1 working day after approval. If you need it today, tick <b>Urgent</b> and explain why.","Collect the cash from Accounting and sign the voucher. Keep your voucher copy.","Keep all receipts for what you buy.","Before the due date, give Accounting your voucher copy, the liquidation form, and your receipts.","Return any extra cash. If you spent more, Accounting will check it and decide about the extra cash.","You cannot make a new request until your last cash is liquidated."]);
  const sp=box("For supervisors",["Open <b>To Approve</b> to see requests from your department.","Check the purpose and amount. You can change the approved amount and add remarks.","Approve the request, or reject it and give a reason.","Use <b>Approval Limits</b> to choose expense types that are approved automatically and to set the limit for each one.","Requests with a red <b>URGENT</b> tag are needed today. Review them first.","You can also send a request for your staff in <b>Request Budget</b>. It is approved right away.","Use <b>Reports</b> and <b>Audit Log</b> to check your department."]);
  const ac=box("For Accounting",["Open <b>Accounting</b>. Urgent requests for today are shown at the top.","Review each approved request. Release the cash, return it with a question, or reject it.","Set the final expense type in <b>Review</b>. Reports use the final type.","When the employee brings the voucher copy, liquidation form, and receipts, open <b>Open Cash</b> and press <b>Liquidate</b>. Enter the actual expenses.","Press <b>Check &amp; Settle</b>. If there is excess cash, confirm you received it. If more cash was needed, confirm you gave it.","Keep <b>Petty Cash Fund</b> updated. Add money when the fund is replenished.","Use <b>Settings</b> for expense types and voucher options. Admin uses <b>Users</b> to add people and set roles."]);
  return R==="accounting"?rq+sp+ac:R==="supervisor"?rq+sp:rq;
}
